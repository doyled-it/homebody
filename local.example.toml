# homebody configuration (example).
#
# deploy/install.sh copies this file to /etc/homebody/local.toml on first install
# if it is missing, at mode 0640 root:homebody. That local copy is the ONLY place
# identifying data lives on the hub: phone hardware addresses, the Nest's node id,
# display names. Never put any of that here, and never commit the local copy. The
# placeholders below are deliberately generic.

[matter]
# The Matter controller's local WebSocket API. The homebody-matter service binds
# it to loopback only. The CLI also honours the HOMEBODY_MATTER_URL environment
# variable, which overrides this.
url = "ws://127.0.0.1:5580/ws"
# The Nest's Matter node id, filled in after commissioning (`homebody matter
# commission <code>` prints it). 0 means "not commissioned yet"; `homebody matter
# status` discovers the thermostat node on its own until this is set.
node_id = 0

# Presence and climate, read by homebody (src/homebody/config.py). Keep real
# addresses and names out of this example file.
#
# Presence is Wi-Fi only. The old `[bluetooth] adapter` key and a person's
# `bluetooth_mac` are still accepted by an old config but ignored, with a
# warning at startup. Remove them. Each person needs a wifi_mac.
#
# [[person]]
# id = "person-a"            # opaque slug used by the API and page (default person-N)
# name = "Person A"            # a display name, not a real name, in this example
# enabled = true               # false = configured but never probed, never counted
# wifi_mac = "<phone-wifi-hardware-address>"   # the fixed private address for this LAN
#
# [climate]
# comfort_f = 72              # setpoint when anyone is home
# away_f = 82                 # setpoint once everyone has been gone the delay
# away_minutes = 20           # minutes unseen before a person counts as away
#
# [daemon]
# # Where the daemon keeps state.json (what it last set, the override flag). The
# # homebody service user must own it. This is the default.
# state_dir = "/var/lib/homebody/state"
#
# [status]
# # Where homebody writes homebody.json for the room picker (nginx serves it). The
# # homebody service user must own this directory. This is the default.
# dir = "/var/lib/snaphouse/public/homebody"
#
# [api]
# # The settings API listens on 127.0.0.1 at this port; nginx proxies
# # /api/homebody/ to it. Settings changed through the API are kept in the daemon
# # state and win over the [climate] values above, which stay read-only.
# port = 8783

#
# The garage door module (src/homebody/garage*.py). Leave [garage] out and the
# module is off. A bad [garage] turns only the garage off and logs why (the
# field, never its value). The board's host, its encryption key, the ntfy
# address and topic, and the house page address live only in the local copy.
#
# [garage]
# host = "<board-address-or-mdns-name>"
# port = 6053
# # The ESPHome API encryption key. The stock blaQ config has no key set, so set
# # one on the board first. Without noise_psk the link is refused unless you
# # also set allow_plaintext = true, which is logged at every start.
# noise_psk = "<base64-32-byte-key>"
# allow_plaintext = false
# page_url = "<url-of-the-house-page>"        # the tunnel hostname, for ntfy clicks
# # Partial overrides merge over the stock names; Lock is the remote lockout.
# entity_names = { cover = "Garage Door", obstruction = "Obstruction", lockout = "Lock" }
# close_wait_seconds = 30     # how long a close waits for the door to move (max 60)
# open_wait_seconds = 10      # the same for an open
# note_wait_seconds = 5       # how long a remote command waits on its ntfy note
# left_open_minutes = 15      # default for the left-open alert (0 turns it off)
# away_open_grace_minutes = 5 # default arrival grace for the opened-away alert
#
# [garage.ntfy]
# url = "<ntfy-server-url>"
# topic = "<ntfy-topic>"
# token = "<ntfy-access-token>"               # optional
#
# [garage.actors]                              # optional labels for audit tags
# "<tag>" = "<display label>"

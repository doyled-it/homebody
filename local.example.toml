# homebody configuration (example).
#
# deploy/install.sh copies this file to /etc/homebody/local.toml on first install
# if it is missing, at mode 0640 root:homebody. That local copy is the ONLY place
# identifying data lives on the hub: phone hardware addresses, the Nest's node id,
# display names. Never put any of that here, and never commit the local copy. The
# placeholders below are deliberately generic.

[matter]
# The Matter controller's local WebSocket API. The homebody-matter service binds
# it to loopback only. The CLI also honours the HOMEBODY_MATTER_URL environment
# variable, which overrides this.
url = "ws://127.0.0.1:5580/ws"
# The Nest's Matter node id, filled in after commissioning (`homebody matter
# commission <code>` prints it). 0 means "not commissioned yet"; `homebody matter
# status` discovers the thermostat node on its own until this is set.
node_id = 0

# The sections below are read by later tasks (presence and the decision loop).
# They are shown here so the seeded local config is complete; Task 1 does not use
# them. Keep real addresses and names out of this example file.
#
# [[person]]
# name = "Person A"            # a display name, not a real name, in this example
# enabled = true
# wifi_mac = "<phone-wifi-hardware-address>"   # the fixed private address for this LAN
# bluetooth_mac = "<phone-bluetooth-address>"  # optional, for the fallback probe
#
# [climate]
# comfort_f = 72              # setpoint when anyone is home
# away_f = 82                 # setpoint once everyone has been gone the delay
# away_minutes = 20           # minutes unseen before a person counts as away
